components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Auth schemas
    AuthUser:
      type: object
      required: [id, username, role, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        username:
          type: ["string", "null"]
        role:
          type: string
        email:
          type: ["string", "null"]
          
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # Dashboard schemas
    DashboardSummary:
      type: object
      required:
        - revenue
        - grossProfit
        - grossMarginPct
        - netProfit
        - ebitda
        - events
        - avgEventValue
        - avgProfitPerEvent
        - pipelineValue
        - weightedPipeline
        - outstandingReceivables
        - repeatClientRate
        - cac
        - ltv
        - ltvCacRatio
        - newClients
        - repeatClients
        - winRate
        - revenueGrowthPct
      properties:
        revenue:
          type: number
        revenueGrowthPct:
          type: ["number", "null"]
        grossProfit:
          type: number
        grossMarginPct:
          type: number
        netProfit:
          type: number
        ebitda:
          type: number
        ebitdaMarginPct:
          type: number
        events:
          type: object
          required: [total, completed, upcoming, inProgress, cancelled]
          properties:
            total:
              type: number
            completed:
              type: number
            upcoming:
              type: number
            inProgress:
              type: number
            cancelled:
              type: number
        avgEventValue:
          type: number
        avgProfitPerEvent:
          type: number
        pipelineValue:
          type: number
        weightedPipeline:
          type: number
        outstandingReceivables:
          type: number
        repeatClientRate:
          type: number
        cac:
          type: ["number", "null"]
        ltv:
          type: ["number", "null"]
        ltvCacRatio:
          type: ["number", "null"]
        newClients:
          type: number
        repeatClients:
          type: number
        winRate:
          type: number

    RevenueTrendPoint:
      type: object
      required: [month, year, revenue, grossProfit, netProfit, events]
      properties:
        month:
          type: number
        year:
          type: number
        revenue:
          type: number
        grossProfit:
          type: number
        netProfit:
          type: number
        events:
          type: number

    EventTypeStats:
      type: object
      required: [eventType, eventCount, totalRevenue, avgRevenue, totalCost, grossProfit, avgGrossProfit, grossMarginPct]
      properties:
        eventType:
          type: string
        eventCount:
          type: number
        totalRevenue:
          type: number
        avgRevenue:
          type: number
        totalCost:
          type: number
        grossProfit:
          type: number
        avgGrossProfit:
          type: number
        grossMarginPct:
          type: number

    Insight:
      type: object
      required: [id, type, message, severity]
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [info, warning, success, alert]
        value:
          type: ["number", "null"]
        changeDirection:
          type: ["string", "null"]

    # Client schemas
    Client:
      type: object
      required: [id, name, clientType, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        company:
          type: ["string", "null"]
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        clientType:
          type: string
        industry:
          type: ["string", "null"]
        leadSource:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isDemo:
          type: boolean
        totalEvents:
          type: number
        lifetimeRevenue:
          type: number
        lifetimeGrossProfit:
          type: number
        totalOutstanding:
          type: number
        repeatClient:
          type: boolean
        firstEventDate:
          type: ["string", "null"]
          format: date
        lastEventDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClientInput:
      type: object
      required: [name, clientType]
      properties:
        name:
          type: string
          minLength: 1
        company:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
          
        location:
          type: string
        clientType:
          type: string
        industry:
          type: string
        leadSource:
          type: string
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        company:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
          
        location:
          type: string
        clientType:
          type: string
        industry:
          type: string
        leadSource:
          type: string
        notes:
          type: string

    ClientListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    ClientProfitability:
      type: object
      required: [clientId, totalRevenue, totalCost, grossProfit, grossMarginPct, totalCollected, totalOutstanding, events]
      properties:
        clientId:
          type: number
        totalRevenue:
          type: number
        totalCost:
          type: number
        grossProfit:
          type: number
        grossMarginPct:
          type: number
        totalCollected:
          type: number
        totalOutstanding:
          type: number
        ltv:
          type: number
        events:
          type: array
          items:
            type: object
            required: [id, name, date, revenue, grossProfit, grossMarginPct]
            properties:
              id:
                type: number
              name:
                type: string
              date:
                type: string
                format: date
              revenue:
                type: number
              grossProfit:
                type: number
              grossMarginPct:
                type: number

    # Event schemas
    Event:
      type: object
      required: [id, name, clientId, eventType, status, eventDate, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        clientId:
          type: number
        clientName:
          type: ["string", "null"]
        eventType:
          type: string
        status:
          type: string
          enum: [upcoming, in_progress, completed, cancelled]
        eventDate:
          type: string
          format: date
        venue:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salespersonId:
          type: ["integer", "null"]
        salespersonName:
          type: ["string", "null"]
        operationsManagerId:
          type: ["integer", "null"]
        leadSource:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isDemo:
          type: boolean
        totalRevenue:
          type: number
        totalCost:
          type: number
        grossProfit:
          type: number
        grossMarginPct:
          type: number
        profitabilityIndicator:
          type: string
          enum: [excellent, healthy, warning, loss, awaiting_data]
        totalCollected:
          type: number
        totalOutstanding:
          type: number
        createdAt:
          type: string
          format: date-time

    EventDetail:
      type: object
      required: [id, name, clientId, eventType, status, eventDate, createdAt, revenue, costs]
      properties:
        id:
          type: number
        name:
          type: string
        clientId:
          type: number
        clientName:
          type: ["string", "null"]
        eventType:
          type: string
        status:
          type: string
          enum: [upcoming, in_progress, completed, cancelled]
        eventDate:
          type: string
          format: date
        venue:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        salespersonId:
          type: ["integer", "null"]
        salespersonName:
          type: ["string", "null"]
        operationsManagerId:
          type: ["integer", "null"]
        leadSource:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isDemo:
          type: boolean
        totalRevenue:
          type: number
        totalCost:
          type: number
        grossProfit:
          type: number
        grossMarginPct:
          type: number
        profitabilityIndicator:
          type: string
        totalCollected:
          type: number
        totalOutstanding:
          type: number
        createdAt:
          type: string
          format: date-time
        revenue:
          $ref: "#/components/schemas/EventRevenue"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/EventCost"

    EventInput:
      type: object
      required: [name, clientId, eventType, status, eventDate]
      properties:
        name:
          type: string
          minLength: 1
        clientId:
          type: number
        eventType:
          type: string
        status:
          type: string
          enum: [upcoming, in_progress, completed, cancelled]
        eventDate:
          type: string
          format: date
        venue:
          type: string
        location:
          type: string
        salespersonId:
          type: number
        operationsManagerId:
          type: number
        leadSource:
          type: string
        notes:
          type: string

    EventUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        clientId:
          type: number
        eventType:
          type: string
        status:
          type: string
          enum: [upcoming, in_progress, completed, cancelled]
        eventDate:
          type: string
          format: date
        venue:
          type: string
        location:
          type: string
        salespersonId:
          type: number
        operationsManagerId:
          type: number
        leadSource:
          type: string
        notes:
          type: string

    EventListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    # Event Revenue schemas
    EventRevenue:
      type: object
      required: [id, eventId, contractValue, gst, totalInvoiceValue, netRevenue, advanceReceived, secondPayment, finalPayment, totalCollected, outstandingAmount, createdAt]
      properties:
        id:
          type: number
        eventId:
          type: number
        contractValue:
          type: number
        discount:
          type: number
        gst:
          type: number
        totalInvoiceValue:
          type: number
        netRevenue:
          type: number
        advanceReceived:
          type: number
        secondPayment:
          type: number
        finalPayment:
          type: number
        totalCollected:
          type: number
        outstandingAmount:
          type: number
        paymentStatus:
          type: string
          enum: [pending, partially_paid, paid, overdue]
        invoiceNumber:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time

    EventRevenueInput:
      type: object
      required: [contractValue, gst]
      properties:
        contractValue:
          type: number
        discount:
          type: number
        gst:
          type: number
        advanceReceived:
          type: number
        secondPayment:
          type: number
        finalPayment:
          type: number
        paymentStatus:
          type: string
          enum: [pending, partially_paid, paid, overdue]
        invoiceNumber:
          type: string
        dueDate:
          type: string
          format: date

    # Event Cost schemas
    EventCost:
      type: object
      required: [id, eventId, category, amount, gst, paymentStatus, createdAt]
      properties:
        id:
          type: number
        eventId:
          type: number
        vendorId:
          type: ["integer", "null"]
        vendorName:
          type: ["string", "null"]
        category:
          type: string
        description:
          type: ["string", "null"]
        amount:
          type: number
