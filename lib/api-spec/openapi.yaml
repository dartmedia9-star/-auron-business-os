openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Auron Business OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: dashboard
    description: CEO dashboard and KPI aggregates
  - name: clients
    description: Client CRM
  - name: events
    description: Event management
  - name: eventRevenue
    description: Event revenue tracking
  - name: eventCosts
    description: Event cost tracking
  - name: leads
    description: Lead and pipeline management
  - name: marketing
    description: Marketing channels and CAC tracking
  - name: finance
    description: Finance and operating expenses
  - name: vendors
    description: Vendor management
  - name: assets
    description: Asset management
  - name: employees
    description: Team management
  - name: valuation
    description: Valuation scenarios and growth planning
  - name: notifications
    description: In-app notifications
  - name: settings
    description: Company settings
  - name: auditLogs
    description: Audit logs for financial changes
  - name: reports
    description: Analytics and reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: CEO dashboard KPI summary
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [month, quarter, year]
            default: year
        - name: year
          in: query
          required: false
          schema:
            type: number
        - name: month
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [dashboard]
      summary: Monthly revenue and profit trend for charts
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: number
            default: 12
      responses:
        "200":
          description: Revenue trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueTrendPoint"

  /dashboard/event-type-breakdown:
    get:
      operationId: getEventTypeBreakdown
      tags: [dashboard]
      summary: Revenue and profit broken down by event type
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Event type breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventTypeStats"

  /dashboard/insights:
    get:
      operationId: getDashboardInsights
      tags: [dashboard]
      summary: CEO data-driven insights derived from actual data
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"

  # Clients
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: clientType
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, revenue, grossProfit, events, ltv]
        - name: page
          in: query
          required: false
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Clients list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponse"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /clients/{id}/profitability:
    get:
      operationId: getClientProfitability
      tags: [clients]
      summary: Get profitability details for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Client profitability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfitability"

  # Events
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          schema:
            type: number
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID with full profitability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Event with profitability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # Event Revenue
  /events/{eventId}/revenue:
    get:
      operationId: getEventRevenue
      tags: [eventRevenue]
      summary: Get revenue record for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Event revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRevenue"
    post:
      operationId: upsertEventRevenue
      tags: [eventRevenue]
      summary: Create or update event revenue
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRevenueInput"
      responses:
        "200":
          description: Updated revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRevenue"

  # Event Costs
  /events/{eventId}/costs:
    get:
      operationId: listEventCosts
      tags: [eventCosts]
      summary: List all costs for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Event costs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventCost"
    post:
      operationId: createEventCost
      tags: [eventCosts]
      summary: Add a cost to an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCost"

  /events/{eventId}/costs/{id}:
    patch:
      operationId: updateEventCost
      tags: [eventCosts]
      summary: Update a cost entry
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCostUpdate"
      responses:
        "200":
          description: Updated cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCost"
    delete:
      operationId: deleteEventCost
      tags: [eventCosts]
      summary: Delete a cost entry
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # Leads
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: salespersonId
          in: query
          required: false
          schema:
            type: number
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Leads list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadListResponse"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /pipeline/summary:
    get:
      operationId: getPipelineSummary
      tags: [leads]
      summary: Sales pipeline summary metrics
      responses:
        "200":
          description: Pipeline summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSummary"

  # Marketing
  /marketing/channels:
    get:
      operationId: listMarketingChannels
      tags: [marketing]
      summary: List marketing channels
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingChannel"
    post:
      operationId: createMarketingChannel
      tags: [marketing]
      summary: Create a marketing channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingChannelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingChannel"

  /marketing/channels/{id}:
    patch:
      operationId: updateMarketingChannel
      tags: [marketing]
      summary: Update a marketing channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingChannelUpdate"
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingChannel"

  /marketing/spend:
    get:
      operationId: listMarketingSpend
      tags: [marketing]
      summary: List marketing spend records
      parameters:
        - name: channelId
          in: query
          required: false
          schema:
            type: number
        - name: year
          in: query
          required: false
          schema:
            type: number
        - name: month
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Spend records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingSpend"
    post:
      operationId: createMarketingSpend
      tags: [marketing]
      summary: Record marketing spend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingSpendInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingSpend"

  /marketing/spend/{id}:
    patch:
      operationId: updateMarketingSpend
      tags: [marketing]
      summary: Update a marketing spend record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingSpendUpdate"
      responses:
        "200":
          description: Updated spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingSpend"
    delete:
      operationId: deleteMarketingSpend
      tags: [marketing]
      summary: Delete a marketing spend record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /marketing/roi:
    get:
      operationId: getMarketingRoi
      tags: [marketing]
      summary: Marketing ROI and CAC by channel
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Marketing ROI breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingRoiSummary"

  # Finance
  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Financial summary (P&L, EBITDA, net profit)
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: number
        - name: month
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"

  /finance/expenses:
    get:
      operationId: listOperatingExpenses
      tags: [finance]
      summary: List operating expenses
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: number
        - name: month
          in: query
          required: false
          schema:
            type: number
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Operating expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatingExpense"
    post:
      operationId: createOperatingExpense
      tags: [finance]
      summary: Add an operating expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatingExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingExpense"

  /finance/expenses/{id}:
    patch:
      operationId: updateOperatingExpense
      tags: [finance]
      summary: Update an operating expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatingExpenseUpdate"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingExpense"
    delete:
      operationId: deleteOperatingExpense
      tags: [finance]
      summary: Delete an operating expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /finance/receivables:
    get:
      operationId: getReceivablesSummary
      tags: [finance]
      summary: Accounts receivable summary and aging breakdown
      responses:
        "200":
          description: Receivables summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivablesSummary"

  # Vendors
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Vendors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Vendor
